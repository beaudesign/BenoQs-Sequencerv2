<!doctype html>
<meta charset="utf-8">
<title>browser probe</title>
<script type="module">
const out = { secureContext: isSecureContext, visibility: document.visibilityState };
// (module (func (export "add") (param i32 i32) (result i32) local.get 0 local.get 1 i32.add))
const bytes = new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11]);
try {
  const module = await WebAssembly.compile(bytes);
  const ctx = new AudioContext({ sampleRate: 48000 });
  await ctx.audioWorklet.addModule("worklet.js");
  const node = new AudioWorkletNode(ctx, "probe", { numberOfInputs: 0, outputChannelCount: [1], processorOptions: { module } });
  node.connect(ctx.destination);
  out.worklet = await new Promise((resolve) => { node.port.onmessage = (e) => resolve(e.data); });
  await ctx.resume();
  const ts = ctx.getOutputTimestamp();
  out.audio = { state: ctx.state, sampleRate: ctx.sampleRate, baseLatencySeconds: ctx.baseLatency, outputTimestampHasBothClocks: typeof ts.contextTime === "number" && typeof ts.performanceTime === "number" };
} catch (e) { out.audioError = String(e); }
try {
  const access = await Promise.race([navigator.requestMIDIAccess({ sysex: false }), new Promise((_, no) => setTimeout(() => no(new Error("no answer in 5 s")), 5000))]);
  out.midi = { inputs: access.inputs.size, outputs: access.outputs.size };
} catch (e) { out.midiError = String(e); }
window.__probe = out;
</script>
