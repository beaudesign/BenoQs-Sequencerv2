<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WENGE</title>
<link rel="stylesheet" href="/dist/tokens.css">
<link rel="stylesheet" href="/pages/app.css">
</head>
<body>
<main data-engine="idle" data-transport="stopped">
  <section id="strip" aria-label="Sequencer settings">
    <button id="start" type="button">Start</button>
    <button id="metronome" type="button" aria-pressed="false">Metronome</button>
    <div class="field">
      <label for="midi-out-1">MIDI Out 1</label>
      <select id="midi-out-1"><option value="">No output</option></select>
    </div>
    <div class="field">
      <label for="midi-out-2">MIDI Out 2</label>
      <select id="midi-out-2"><option value="">No output</option></select>
    </div>
    <div class="field">
      <label for="midi-in">MIDI In</label>
      <select id="midi-in"><option value="">No input</option></select>
    </div>
    <div class="field">
      <label for="clock-state">MIDI Clock</label>
      <select id="clock-state">
        <option value="off">Off</option>
        <option value="master">Master Clock</option>
        <option value="slave">Slave Clock</option>
        <option value="slave-echo">Slave Clock with MIDI Clock echo</option>
      </select>
    </div>
    <div class="field">
      <label for="clock-offset">Clock offset in milliseconds</label>
      <input id="clock-offset" type="number" inputmode="numeric" step="1">
    </div>
    <div class="field">
      <label for="lookahead">Lookahead in milliseconds</label>
      <input id="lookahead" type="number" inputmode="numeric" step="1">
    </div>
    <p id="engine-status" role="status">The sequencer has not started.</p>
    <p id="midi-status" role="status">MIDI is asked for when you press Start.</p>
    <p id="midi-in-status" role="status"></p>
    <p id="midi-in-count"></p>
    <p id="clock-status" role="status"></p>
    <p id="clock-detail"></p>
    <p id="route-status" role="status" hidden></p>
  </section>
  <div id="panel-frame"></div>
</main>
<noscript><p>This page needs JavaScript to run the sequencer.</p></noscript>
<script type="module" src="/dist/pages/app.js"></script>
</body>
</html>
